name: Publish OCI image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vitoralmeida-tech
  cancel-in-progress: true

jobs:
  publish-staging:
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

      - name: Validate content
        run: make check

      - name: Build site
        run: make build

      - name: Verify site artifact
        run: make verify

      - name: Build OCI image
        run: |
          podman build \
            -t "ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}" \
            .

      - name: Smoke test image
        run: |
          container=$(podman run -d \
            -p 18080:8080 \
            "ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}")
          trap 'podman rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not return 200 within 30s"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        shell: bash
        run: |
          image="ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}"
          podman push --digestfile=digest.txt "$image"
          branch_tag="${{ github.ref_name }}"
          podman tag "$image" "ghcr.io/vitoraalmeida/vitoralmeida.tech:${branch_tag}"
          podman push "ghcr.io/vitoraalmeida/vitoralmeida.tech:${branch_tag}"

          digest="$(cat digest.txt)"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "cd \$HOME && pneuma app deploy vitoralmeida-tech-staging --branch staging"

      - name: Print deployment instructions
        shell: bash
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Staging image published"
            echo ""
            echo "Deploy this exact immutable reference:"
            echo ""
            echo '```'
            echo "pneuma --verbose app deploy vitoralmeida-tech-staging \\"
            echo "  --image ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

      - name: Validate content
        run: make check

      - name: Build site
        run: make build

      - name: Verify site artifact
        run: make verify

      - name: Build OCI image
        run: |
          podman build \
            -t "ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}" \
            .

      - name: Smoke test image
        run: |
          container=$(podman run -d \
            -p 18080:8080 \
            "ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}")
          trap 'podman rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not return 200 within 30s"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        shell: bash
        run: |
          image="ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}"
          podman push --digestfile=digest.txt "$image"
          podman tag "$image" "ghcr.io/vitoraalmeida/vitoralmeida.tech:main"
          podman push "ghcr.io/vitoraalmeida/vitoralmeida.tech:main"

          digest="$(cat digest.txt)"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "cd \$HOME && pneuma app deploy vitoralmeida-tech-prod --branch main"

      - name: Print deployment instructions
        shell: bash
        env:
            IMAGE: ${{ steps.push.outputs.image }}
            DIGEST: ${{ steps.push.outputs.digest }}
          run: |
            {
              echo "## Production image published"
              echo ""
              echo "Deploy this exact immutable reference:"
              echo ""
              echo '```'
              echo "pneuma --verbose app deploy vitoralmeida-tech-prod \\"
              echo "  --image ${IMAGE}@${DIGEST}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
