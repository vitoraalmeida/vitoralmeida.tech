name: Publish staging OCI image

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-vitoralmeida-tech
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

      - name: Validate content
        run: make check

      - name: Build site
        run: make build

      - name: Verify site artifact
        run: make verify

      - name: Build OCI image
        run: |
          podman build \
            -t "ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}" \
            .

      - name: Smoke test image
        run: |
          container=$(podman run -d \
            -p 18080:8080 \
            "ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}")
          trap 'podman rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not return 200 within 30s"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        shell: bash
        run: |
          image="ghcr.io/vitoraalmeida/vitoralmeida.tech:${{ github.sha }}"
          podman push --digestfile=digest.txt "$image"
          podman tag "$image" "ghcr.io/vitoraalmeida/vitoralmeida.tech:staging"
          podman push "ghcr.io/vitoraalmeida/vitoralmeida.tech:staging"

          digest="$(cat digest.txt)"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Print deployment instructions
        shell: bash
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Staging image published"
            echo ""
            echo "Deploy this exact immutable reference:"
            echo ""
            echo '```'
            echo "pneuma --verbose app deploy vitoralmeida-tech-staging \\"
            echo "  --image ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
